name: Build

on:
  push:
    branches: [linux-support, master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test (mod sync)
        # The other suites need game files / Nexus API keys; the sync tests are self-contained
        # (real HTTPS host + client over localhost).
        run: dotnet test src/Tests -c Release --filter "FullyQualifiedName~ModSyncTests"

      - name: NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Version
        # Tags like v2.3.0-sync set the app version (the launcher compares it with the latest release tag).
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"; v="${v%%-*}"; v="${v%%+*}"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION_ARGS=-p:AssemblyVersion=$v.0 -p:FileVersion=$v.0" >> "$GITHUB_ENV"
          fi

      - name: Publish
        # Layout: BG3ModManager/ = launcher (updater), BG3ModManager/app/ = the mod manager.
        shell: bash
        run: |
          dotnet publish src/GUI/Desktop-Avalonia -c Release -r ${{ matrix.rid }} --self-contained true -o out/BG3ModManager/app $VERSION_ARGS
          dotnet publish src/Launcher -c Release -r ${{ matrix.rid }} -o out/BG3ModManager

      - name: Package (Linux)
        if: runner.os == 'Linux'
        # zip (Info-ZIP) keeps the executable bit. The tar.gz is for launchers before 2.4, which only look for that.
        run: |
          (cd out && zip -qr -X ../BG3ModManager-${{ matrix.rid }}.zip BG3ModManager)
          tar -czf BG3ModManager-${{ matrix.rid }}.tar.gz -C out BG3ModManager

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/BG3ModManager -DestinationPath BG3ModManager-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BG3ModManager-${{ matrix.rid }}
          path: BG3ModManager-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Not a prerelease: the launcher only picks up "latest" releases.
          prerelease: false
